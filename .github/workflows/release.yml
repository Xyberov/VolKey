# Выпуск релиза: git tag v1.2.0 && git push origin v1.2.0
# Собирает портативный exe и установщик и публикует их в GitHub Releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish exe
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish -c Release -p:PublishProfile=Installer -p:Version=$version

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName VolKeySetup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item Output\VolKeySetup.exe release\VolKeySetup.exe
          Copy-Item publish\VolKey.exe release\VolKey-portable.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
